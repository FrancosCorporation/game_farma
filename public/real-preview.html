<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><title>Real Preview</title>
<style>html,body{margin:0;height:100%;background:#141a22;overflow:hidden}#c{width:100vw;height:100vh;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const qs=new URLSearchParams(location.search);
const name=qs.get('m')||'paciente_real';
const poseKey=qs.get('pose')||'idle';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.AgXToneMapping; renderer.toneMappingExposure=1.0;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x1b2330);
scene.add(new THREE.HemisphereLight(0xdfe9f5,0x2a2622,0.85));
const key=new THREE.DirectionalLight(0xfff2e0,2.6); key.position.set(2,4,4); key.castShadow=true; key.shadow.mapSize.set(2048,2048); scene.add(key);
const rim=new THREE.DirectionalLight(0x9fc8ff,1.3); rim.position.set(-2,2,-3); scene.add(rim);
const fill=new THREE.PointLight(0x9fd8ff,4,10); fill.position.set(-2,2.5,3); scene.add(fill);
const floor=new THREE.Mesh(new THREE.CircleGeometry(8,48),new THREE.MeshStandardMaterial({color:0x28333e,roughness:0.9}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.05,20);

const POSES={
  idle:{LeftArm:{x:0.08,y:0,z:-1.35},RightArm:{x:0.08,y:0,z:1.35},LeftForeArm:{x:0,y:0,z:-0.3},RightForeArm:{x:0,y:0,z:0.3},LeftHand:{x:0,y:0,z:-0.12},RightHand:{x:0,y:0,z:0.12},Spine:{x:0,y:0,z:0},Neck:{x:0,y:0,z:0}},
  mao_no_peito:{LeftArm:{x:0.08,y:0,z:-1.35},LeftForeArm:{x:0,y:0,z:-0.3},RightArm:{x:0.1,y:0,z:0.5},RightForeArm:{x:0,y:0,z:1.35},RightHand:{x:0,y:0,z:0.2},Neck:{x:-0.12,y:0,z:0}},
  curvado:{LeftArm:{x:-0.25,y:0,z:-1.1},RightArm:{x:-0.25,y:0,z:1.1},LeftForeArm:{x:0,y:0,z:-0.3},RightForeArm:{x:0,y:0,z:0.3},Spine:{x:-0.45,y:0,z:0},Spine1:{x:-0.35,y:0,z:0},Spine2:{x:-0.25,y:0,z:0},Neck:{x:-0.35,y:0,z:0},Head:{x:-0.15,y:0,z:0}},
  cabeca_baixa:{LeftArm:{x:0.08,y:0,z:-1.35},RightArm:{x:0.08,y:0,z:1.35},Neck:{x:-0.55,y:0,z:0},Head:{x:-0.25,y:0,z:0},Spine2:{x:-0.2,y:0,z:0}},
};
const bones={};
new GLTFLoader().load(`models/${name}.glb`,(gltf)=>{
  const model=gltf.scene;
  model.traverse(o=>{
    if(o.isBone&&o.name) bones[o.name]=o;
    if(o.isMesh){ o.castShadow=true;
      const mats=Array.isArray(o.material)?o.material:[o.material];
      mats.forEach((mt,i)=>{ if(!mt?.isMeshStandardMaterial) return;
        try {
          const p=new THREE.MeshPhysicalMaterial(); p.copy(mt);
          const n=(mt.name||'').toLowerCase();
          if(n.includes('skin')||n.includes('body')){p.sheen=0.35;p.sheenColor.set(0xa84838);p.sheenRoughness=0.6;}
          if(n.includes('eye')){p.clearcoat=0.3;p.clearcoatRoughness=0.15;}
          p.clearcoat=Math.max(p.clearcoat||0,0.05); p.envMapIntensity=0.6;
          if(p.map)p.map.colorSpace=THREE.SRGBColorSpace; mats[i]=p;
        } catch(e) { /* material Standard simples (ex.: export Blender): mantém o original */ }
      });
      if(Array.isArray(o.material))o.material=mats; else o.material=mats[0];
    }
  });
  const box=new THREE.Box3().setFromObject(model); const size=box.getSize(new THREE.Vector3());
  model.scale.setScalar(1.72/Math.max(size.y,1e-4));
  box.setFromObject(model); model.position.y-=box.min.y; model.position.x-=(box.max.x+box.min.x)/2; model.position.z-=box.min.z;
  scene.add(model);
  const apply=(t)=>{for(const n in t){const b=bones[n]; if(b)b.rotation.set(t[n].x||0,t[n].y||0,t[n].z||0);}};
  apply(POSES[poseKey]||POSES.idle);
  window.__setPose=(k)=>apply(POSES[k]||POSES.idle);
  window.__bones=bones;
  window.__ready=true;
  camera.position.set(0,1.52,1.9); camera.lookAt(0,1.2,0);
});
const loop=()=>{renderer.render(scene,camera);requestAnimationFrame(loop);}; requestAnimationFrame(loop);
</script></body></html>
