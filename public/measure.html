<!DOCTYPE html><html><head><meta charset="utf-8"><title>m</title></head><body>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const name=new URLSearchParams(location.search).get('m')||'paciente_real';
new GLTFLoader().load('models/'+name+'.glb',(g)=>{
  const box=new THREE.Box3().setFromObject(g.scene);
  const s=box.getSize(new THREE.Vector3());
  const c=box.getCenter(new THREE.Vector3());
  window.__res = { size: {x:+s.x.toFixed(3), y:+s.y.toFixed(3), z:+s.z.toFixed(3)}, center:{x:+c.x.toFixed(3),y:+c.y.toFixed(3),z:+c.z.toFixed(3)}, meshes: g.scene.children.length };
}, undefined, (e)=>{ window.__res = 'ERRO: '+e.message; });
</script></body></html>
